name: Browser app on Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gate_schedule/**'
      - 'web/**'
      - 'scripts/prepare-browser.py'
      - 'scripts/browser-wheels.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e .
      - run: mkdir -p .tmp
      - run: npm ci --prefix web
      - run: python -m unittest tests.test_browser_runtime -v
      - run: npm run build:browser --prefix web
      - run: npm run test:browser --prefix web
        env:
          GATE_TEST_PYTHON: python
          GATE_TEST_BROWSER: /usr/bin/google-chrome
          TEMP: ${{ github.workspace }}/.tmp
          TMP: ${{ github.workspace }}/.tmp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
